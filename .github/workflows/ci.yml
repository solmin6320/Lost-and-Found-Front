name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 액션은 커밋 SHA 로 고정한다(태그는 옮길 수 있다 — 탈취된 태그가 CI 에서 돌지 않게). 주석의 버전은 Dependabot 이 SHA 와 함께 올린다
    steps:
      # 이 뒤에 git push 같은 단계가 없다 — 토큰을 .git/config 에 남기지 않는다
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 공급망(보안명세서 6장). 받은 패키지가 레지스트리가 서명한 그대로인지
      - run: npm audit signatures
      # 운영 번들에 들어가는 의존성(react · router · query 등)에 high 이상 취약점이 있으면 멈춘다
      - run: npm audit --omit=dev --audit-level=high
      # 개발 도구(vite · vitest · oxlint)까지 — 개발 서버 쪽 알림이 잦아 경고만 남긴다(번들에는 들어가지 않는다)
      - run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run typecheck
      - run: npx oxlint --max-warnings=0
      - run: npm test
      - run: npm run build
