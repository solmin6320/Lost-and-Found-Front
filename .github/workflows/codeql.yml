# 정적 보안 분석(보안명세서 6장). 백엔드 리포의 codeql.yml 과 같은 방식 — push main · PR · 매주 한 번
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 (KST)

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 보안 취약점 분석
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 분석 결과를 Security 탭에 올리기 위해 필요
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # JS · TS 는 빌드 없이 소스를 그대로 읽는다(build-mode: none)
      - name: CodeQL 초기화
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: CodeQL 분석
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
