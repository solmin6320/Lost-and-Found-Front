<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>분실물 찾기 - 잃어버린 물건, 주운 물건을 주인에게</title>
    <meta name="description" content="분실 글과 습득 글을 사진 · 장소 · 날짜로 올리고 찾아요. 연락은 댓글로 하고, 글에 전화번호가 보이면 미리 알려 드려요." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      theme-color 는 두 곳이 읽는다.
      - 링크 미리보기(디스코드 왼쪽 세로 막대) — 스크립트를 돌리지 않으니 이 글자 그대로 코발트(--found-500)
      - 브라우저 주소창 — 바로 아래 theme-init.js 가 그리기 전에 화면 모드 색(#ffffff · #16171a)으로 바꾼다
    -->
    <meta name="theme-color" content="#2f5fb1" />
    <!--
      화면 모드(밝게 · 어둡게)를 첫 화면 전에 붙인다. 깜빡임을 막으려고 동기로 불러온다.
      인라인 스크립트는 CSP(script-src 'self')가 막으므로 같은 출처의 파일로 둔다 — public/theme-init.js
    -->
    <script src="/theme-init.js"></script>

    <!--
      링크 미리보기(Open Graph · Twitter 카드). docs/배포.md 10장.
      og:url · og:image · twitter:image 의 주소 자리는 빌드가 SITE_URL(기본 운영 주소)로 채운다 — 미리보기는 절대 주소만 읽는다(build/linkPreview.ts).
      twitter:card 는 summary — 디스코드 · 슬랙이 그림을 오른쪽 작은 썸네일로 둔다. 카카오톡은 이 값을 보지 않고 큰 그림으로 둔다
    -->
    <meta property="og:site_name" content="분실물 찾기" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="분실물 찾기 - 잃어버린 물건, 주운 물건을 주인에게" />
    <meta property="og:description" content="분실 글과 습득 글을 사진 · 장소 · 날짜로 올리고 찾아요. 연락은 댓글로 하고, 글에 전화번호가 보이면 미리 알려 드려요." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="분실물 찾기 로고와 이름, 분실 지갑 포스터와 습득 휴대폰 포스터 그림" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="분실물 찾기 - 잃어버린 물건, 주운 물건을 주인에게" />
    <meta name="twitter:description" content="분실 글과 습득 글을 사진 · 장소 · 날짜로 올리고 찾아요. 연락은 댓글로 하고, 글에 전화번호가 보이면 미리 알려 드려요." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="분실물 찾기 로고와 이름, 분실 지갑 포스터와 습득 휴대폰 포스터 그림" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
